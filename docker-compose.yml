services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: payguard
      POSTGRES_PASSWORD: payguard
      POSTGRES_DB: payguard
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payguard"]
      interval: 3s
      timeout: 3s
      retries: 10
  app:
    build: .
    depends_on:
      db: { condition: service_healthy }
    environment:
      PG_URL: jdbc:postgresql://db:5432/payguard
      PG_USER: payguard
      PG_PASSWORD: payguard
    ports: ["8080:8080"]
